name: Apply Integration Seam

on:
  push:
    paths:
      - '.github/scripts/apply-integration-seam.py'
      - '.github/workflows/apply-integration-seam.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GodPlugin
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply integration seam patch
        run: python .github/scripts/apply-integration-seam.py

      - name: Commit integration seam
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No integration seam changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/dev/liamtolkkinen/god/GodPlugin.java
          git commit -m "Wire GodApi integration tools into GodPlugin"
          git push origin HEAD:main
