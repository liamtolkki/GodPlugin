name: God
version: '${version}'
main: dev.liamtolkkinen.god.GodPlugin
description: Language-model conversation bridge for the Minecraft server
author: LiamTolkkinen
api-version: '26.1.2'
load: POSTWORLD
commands:
  god:
    description: Configure and inspect GOD
    usage: /god <on|off|listen|status|reload|integrations>
permissions:
  god.admin:
    description: Allows GOD administration commands
    default: op
